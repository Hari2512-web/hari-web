<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hari's Weather App</title>

  <!-- Google Font -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a,
        #2563eb
      );

      overflow-x:hidden;
      padding:20px;
      color:white;

    }

    /* Background Glow */

    body::before,
    body::after{

      content:"";
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      filter:blur(120px);
      z-index:-1;

    }

    body::before{

      background:#00e5ff;
      top:-100px;
      left:-100px;

    }

    body::after{

      background:#ff00cc;
      bottom:-100px;
      right:-100px;

    }

    /* Weather App Card */

    .weather-app{

      width:100%;
      max-width:520px;

      background:
      rgba(255,255,255,0.12);

      backdrop-filter:blur(15px);

      border:1px solid rgba(255,255,255,0.2);

      border-radius:25px;

      padding:35px;

      box-shadow:
      0 10px 40px rgba(0,0,0,0.35);

      text-align:center;

      animation:fadeIn 0.7s ease;

    }

    /* Heading */

    h1{

      font-size:34px;
      margin-bottom:25px;
      font-weight:700;

    }

    /* Search Area */

    .search-box{

      display:flex;
      gap:12px;
      margin-bottom:30px;

    }

    input{

      flex:1;

      padding:15px;

      border:none;
      outline:none;

      border-radius:14px;

      background:
      rgba(255,255,255,0.15);

      color:white;

      font-size:15px;

      transition:0.3s;

    }

    input::placeholder{

      color:rgba(255,255,255,0.7);

    }

    input:focus{

      background:
      rgba(255,255,255,0.25);

      transform:scale(1.02);

    }

    button{

      padding:15px 22px;

      border:none;

      border-radius:14px;

      background:
      linear-gradient(
        135deg,
        #00e5ff,
        #0077ff
      );

      color:white;

      font-weight:600;

      cursor:pointer;

      transition:0.3s;

      box-shadow:
      0 5px 20px rgba(0,119,255,0.3);

    }

    button:hover{

      transform:translateY(-3px);

      box-shadow:
      0 10px 25px rgba(0,119,255,0.5);

    }

    /* Weather Box */

    .weather-box{

      margin-top:20px;

      background:
      rgba(255,255,255,0.08);

      padding:25px;

      border-radius:22px;

      text-align:left;

      animation:fadeIn 0.5s ease;

      line-height:2;

    }

    .weather-box h2{

      text-align:center;
      margin-bottom:15px;
      font-size:28px;

    }

    .weather-box p{

      font-size:16px;

      background:
      rgba(255,255,255,0.08);

      padding:10px 15px;

      border-radius:12px;

      margin-bottom:10px;

      transition:0.3s;

    }

    .weather-box p:hover{

      background:
      rgba(255,255,255,0.15);

      transform:translateX(5px);

    }

    /* Animation */

    @keyframes fadeIn{

      from{

        opacity:0;
        transform:translateY(20px);

      }

      to{

        opacity:1;
        transform:translateY(0);

      }

    }

    /* Responsive */

    @media(max-width:600px){

      .weather-app{

        padding:25px;

      }

      h1{

        font-size:28px;

      }

      .search-box{

        flex-direction:column;

      }

      button{

        width:100%;

      }

      .weather-box h2{

        font-size:24px;

      }

      .weather-box p{

        font-size:14px;

      }

    }

  </style>

</head>

<body>

  <div class="weather-app">

    <h1>🌦 Hari's Weather App</h1>

    <!-- Search -->

    <div class="search-box">

      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name..."
      >

      <button onclick="getWeather()">
        Search
      </button>

    </div>

    <!-- Weather Data -->

    <div class="weather-box" id="weather">

      <p style="text-align:center;">
        Search a city to see weather 🌍
      </p>

    </div>

  </div>

  <script>

    async function getWeather(){

      const city =
      document.getElementById("cityInput").value;

      const apiKey =
      "537a33eaa224a0cb1bd7db5c0848bdbf";

      const url =
      `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try{

        const response =
        await fetch(url);

        const data =
        await response.json();

        if(data.cod === "404"){

          document
          .getElementById("weather")
          .innerHTML = `

            <p style="
              text-align:center;
              color:#ffb3b3;
            ">
              ❌ City not found
            </p>

          `;

        }

        else{

          document
          .getElementById("weather")
          .innerHTML = `

            <h2>
              ${data.name},
              ${data.sys.country}
            </h2>

            <p>
              🌡 Temperature:
              ${data.main.temp}°C
              (Feels like:
              ${data.main.feels_like}°C)
            </p>

            <p>
              ☁ Weather:
              ${data.weather[0].description}
            </p>

            <p>
              💧 Humidity:
              ${data.main.humidity}%
            </p>

            <p>
              🌡 Min:
              ${data.main.temp_min}°C
              |
              Max:
              ${data.main.temp_max}°C
            </p>

            <p>
              💨 Wind:
              ${data.wind.speed} m/s
            </p>

            <p>
              📊 Pressure:
              ${data.main.pressure} hPa
            </p>

            <p>
              👁 Visibility:
              ${data.visibility / 1000} km
            </p>

            <p>
              🌅 Sunrise:
              ${new Date(
                data.sys.sunrise * 1000
              ).toLocaleTimeString()}
            </p>

            <p>
              🌇 Sunset:
              ${new Date(
                data.sys.sunset * 1000
              ).toLocaleTimeString()}
            </p>

            <p>
              ☁ Clouds:
              ${data.clouds.all}%
            </p>

          `;

        }

      }

      catch(error){

        document
        .getElementById("weather")
        .innerHTML = `

          <p style="
            text-align:center;
            color:#ffb3b3;
          ">
            ⚠ Something went wrong
          </p>

        `;

      }

    }

  </script>

</body>

</html>
